<svg xmlns="http://www.w3.org/2000/svg" width="860" height="136" viewBox="0 0 860 136" role="img" aria-labelledby="title desc">
<title id="title">ASPIRE</title><desc id="desc">The two returns operate at different times. A trace can repair the current program. A validated repair can enter the skill library for retrieval on a later task.</desc>
