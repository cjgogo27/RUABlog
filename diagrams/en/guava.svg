<svg xmlns="http://www.w3.org/2000/svg" width="860" height="99" viewBox="0 0 860 99" role="img" aria-labelledby="title desc">
<title id="title">Guava</title><desc id="desc">An alignment result only establishes alignment. The model reads the return before it can decide to close the gripper. Teacher and student share the tool interface.</desc>
<style>text{font:15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#17343b;text-anchor:middle}
    .feedback{font-size:13px;fill:#14645c}.wire,.back{fill:none;stroke:#627c81;stroke-width:1.55;stroke-linejoin:round}
    .back{stroke:#287b71}.focus{font-weight:600}</style><defs>
<marker id="out" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627c81"/></marker>
<marker id="in" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#287b71"/></marker>
</defs><rect width="100%" height="100%" fill="white"/>
<path class="wire" d="M207.5 31.5 H219.5 V31.5 H228.5" marker-end="url(#out)"/>
<path class="wire" d="M420.0 31.5 H432.0 V31.5 H441.0" marker-end="url(#out)"/>
<path class="wire" d="M632.5 31.5 H644.5 V31.5 H653.5" marker-end="url(#out)"/>
<path class="back" d="M750.75 55 V81 H325.75 V58" marker-end="url(#in)"/>
<text class="feedback" x="538.25" y="76">Tool evidence returns to the model for its next call</text>
<rect x="19.0" y="8" width="188.5" height="47" rx="4" fill="#ffffff" stroke="#a8bcba"/>
<text class="node" x="113.25" y="28.0">Image, gripper</text>
<text class="node" x="113.25" y="45.0">state and history</text>
<rect x="231.5" y="8" width="188.5" height="47" rx="4" fill="#eaf5f2" stroke="#26766d"/>
<text class="focus" x="325.75" y="28.0">Teacher or</text>
<text class="focus" x="325.75" y="45.0">Guava-4B</text>
<rect x="444.0" y="8" width="188.5" height="47" rx="4" fill="#eaf5f2" stroke="#26766d"/>
<text class="focus" x="538.25" y="28.0">One tool name</text>
<text class="focus" x="538.25" y="45.0">and arguments</text>
<rect x="656.5" y="8" width="188.5" height="47" rx="4" fill="#ffffff" stroke="#a8bcba"/>
<text class="node" x="750.75" y="28.0">Perception or</text>
<text class="node" x="750.75" y="45.0">manipulation tool</text>
</svg>
