<svg xmlns="http://www.w3.org/2000/svg" width="860" height="156" viewBox="0 0 860 156" role="img" aria-labelledby="title desc">
<title id="title">VoxPoser</title><desc id="desc">“接近把手”和“远离杯子”可各写成一张图。两图合成后由规划器求动作，场景变化时可以重算几何而复用同一段代码。</desc>
<style>text{font:15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#17343b;text-anchor:middle}
    .feedback{font-size:13px;fill:#14645c}.wire,.back{fill:none;stroke:#627c81;stroke-width:1.55;stroke-linejoin:round}
    .back{stroke:#287b71}.focus{font-weight:600}</style><defs>
<marker id="out" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627c81"/></marker>
<marker id="in" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#287b71"/></marker>
</defs><rect width="100%" height="100%" fill="white"/>
<path class="wire" d="M207.5 31.5 H219.5 V59.5 H228.5" marker-end="url(#out)"/>
<path class="wire" d="M207.5 88.5 H219.5 V59.5 H228.5" marker-end="url(#out)"/>
<path class="wire" d="M420.0 59.5 H432.0 V59.5 H441.0" marker-end="url(#out)"/>
<path class="wire" d="M632.5 59.5 H644.5 V59.5 H653.5" marker-end="url(#out)"/>
<path class="back" d="M750.75 83 V138 H113.25 V115" marker-end="url(#in)"/>
<text class="feedback" x="432.0" y="133">新观察更新场景几何，重新计算值图与轨迹</text>
<rect x="19.0" y="8" width="188.5" height="47" rx="4" fill="#ffffff" stroke="#a8bcba"/>
<text class="node" x="113.25" y="28.0">指令 → 模型写出</text>
<text class="node" x="113.25" y="45.0">目标与约束代码</text>
<rect x="19.0" y="65" width="188.5" height="47" rx="4" fill="#ffffff" stroke="#a8bcba"/>
<text class="node" x="113.25" y="85.0">场景 → 视觉定位</text>
<text class="node" x="113.25" y="102.0">与三维重建</text>
<rect x="231.5" y="36" width="188.5" height="47" rx="4" fill="#eaf5f2" stroke="#26766d"/>
<text class="focus" x="325.75" y="64.5">合成三维值图</text>
<rect x="444.0" y="36" width="188.5" height="47" rx="4" fill="#ffffff" stroke="#a8bcba"/>
<text class="node" x="538.25" y="56.0">运动规划器</text>
<text class="node" x="538.25" y="73.0">求末端轨迹</text>
<rect x="656.5" y="36" width="188.5" height="47" rx="4" fill="#ffffff" stroke="#a8bcba"/>
<text class="node" x="750.75" y="64.5">机械臂执行</text>
</svg>
